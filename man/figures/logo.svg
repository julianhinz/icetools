<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200px" height="200px" fill="none" stroke="#0288d1" stroke-width="3">
  <!-- Define a single branch -->
  <g id="branch">
    <line x1="50" y1="50" x2="50" y2="5" /> <!-- Main line -->
    <line x1="50" y1="32" x2="38" y2="10" /> <!-- Left branch spreading wider -->
    <line x1="50" y1="32" x2="62" y2="10" /> <!-- Right branch spreading wider -->
  </g>

  <!-- Center point -->
  <circle cx="50" cy="50" r="2" fill="#0288d1" />

  <!-- Rotate and reuse the branch -->
  <use href="#branch" transform="rotate(0 50 50)" />
  <use href="#branch" transform="rotate(60 50 50)" />
  <use href="#branch" transform="rotate(120 50 50)" />
  <use href="#branch" transform="rotate(180 50 50)" />
  <use href="#branch" transform="rotate(240 50 50)" />
  <use href="#branch" transform="rotate(300 50 50)" />
</svg>
